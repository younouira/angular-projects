<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PC Store</title>
  <script>
    // Redirect to the base URL, preserving the path
    const path = window.location.pathname.replace(/^\/pc-store/, '');
    const redirect = '/pc-store/' + (path ? '?redirect=' + encodeURIComponent(path) : '');
    window.location.href = redirect;
  </script>
</head>

</body>
</html>
